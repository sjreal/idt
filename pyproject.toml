[project]
name = "idt-llm-cicd"
version = "0.1.0"
description = "A reproducible LLM application and guardrail evaluation project."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "llm-guard[onnxruntime]==0.3.16",
    "prometheus-client>=0.21,<1",
    "torch>=2.4.0",
    "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = [
    "anyio>=4.8,<5",
    "pip-audit>=2.9,<3",
    "pytest-cov>=6,<8",
    "pytest>=9.0.3,<10",
    "ruff>=0.11,<1",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_app", "src/security_eval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.uv]
# Keep patched JSON/AES libraries despite old bounds in the pinned LLM Guard stack.
# tests/test_security_dependency_overrides.py exercises the APIs used by those packages.
override-dependencies = [
    "cryptography>=50,<51",
    "json-repair>=0.60.1,<1",
]
