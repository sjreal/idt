global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: idt-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]

  - job_name: github-actions
    metrics_path: /metrics
    static_configs:
      - targets: ["github-actions-exporter:9101"]
