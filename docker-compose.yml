name: idt-llm-cicd

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      LLM_BACKEND: ${LLM_BACKEND:-ollama}
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:1b}
      GUARDRAIL_LEVEL: ${GUARDRAIL_LEVEL:-off}
      LLAMA_GUARD_BACKEND: ${LLAMA_GUARD_BACKEND:-cloudflare}
      LLAMA_GUARD_BASE_URL: http://ollama:11434
      LLAMA_GUARD_MODEL: ${LLAMA_GUARD_MODEL:-llama-guard3:1b}
      LLAMA_GUARD_TIMEOUT_SECONDS: ${LLAMA_GUARD_TIMEOUT_SECONDS:-90}
      PROMPT_INJECTION_THRESHOLD: ${PROMPT_INJECTION_THRESHOLD:-0.92}
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:-}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
      CLOUDFLARE_LLAMA_GUARD_MODEL: ${CLOUDFLARE_LLAMA_GUARD_MODEL:-@cf/meta/llama-guard-3-8b}
      CLOUDFLARE_API_BASE_URL: ${CLOUDFLARE_API_BASE_URL:-https://api.cloudflare.com/client/v4}
      EVALUATION_RESULTS_DIR: /app/results
      HF_HOME: /models/huggingface
      OPENCODE_GO_BASE_URL: ${OPENCODE_GO_BASE_URL:-https://opencode.ai/zen/go/v1}
      OPENCODE_GO_MODEL: ${OPENCODE_GO_MODEL:-longcat-2.5-preview-free}
      OPENCODE_GO_API_KEY: ${OPENCODE_GO_API_KEY:-}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-120}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - hf_cache:/models/huggingface
      - evaluation_results:/app/results
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 20s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      api:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    profiles: ["data"]
    environment:
      POSTGRES_DB: idt
      POSTGRES_USER: idt
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-idt_local_only}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U idt -d idt"]
      interval: 10s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:0.6.8
    profiles: ["ollama"]
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

volumes:
  postgres_data:
  ollama_data:
  hf_cache:
  evaluation_results:
