name: idt-llm-cicd

services:
  api:
    image: idt-llm-cicd-api:latest
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      LLM_BACKEND: ${LLM_BACKEND:-ollama}
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:1b}
      GUARDRAIL_LEVEL: ${GUARDRAIL_LEVEL:-off}
      LLAMA_GUARD_BACKEND: ${LLAMA_GUARD_BACKEND:-cloudflare}
      LLAMA_GUARD_BASE_URL: http://ollama:11434
      LLAMA_GUARD_MODEL: ${LLAMA_GUARD_MODEL:-llama-guard3:1b}
      LLAMA_GUARD_TIMEOUT_SECONDS: ${LLAMA_GUARD_TIMEOUT_SECONDS:-90}
      PROMPT_INJECTION_THRESHOLD: ${PROMPT_INJECTION_THRESHOLD:-0.92}
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:-}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
      CLOUDFLARE_LLAMA_GUARD_MODEL: ${CLOUDFLARE_LLAMA_GUARD_MODEL:-@cf/meta/llama-guard-3-8b}
      CLOUDFLARE_API_BASE_URL: ${CLOUDFLARE_API_BASE_URL:-https://api.cloudflare.com/client/v4}
      EVALUATION_RESULTS_DIR: /app/results
      HF_HOME: /models/huggingface
      OPENCODE_GO_BASE_URL: ${OPENCODE_GO_BASE_URL:-https://opencode.ai/zen/go/v1}
      OPENCODE_GO_MODEL: ${OPENCODE_GO_MODEL:-deepseek-v4.1-flash}
      OPENCODE_GO_API_KEY: ${OPENCODE_GO_API_KEY:-}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-120}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      # Telemetry (opt-in; empty OTEL endpoint means zero exporter traffic)
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-llm-guardrail-lab}
      OTEL_CAPTURE_CONTENT: ${OTEL_CAPTURE_CONTENT:-false}
      TRACE_CAPTURE_CONTENT: ${TRACE_CAPTURE_CONTENT:-false}
      TRACE_DIR: /app/traces
      TRACE_RETENTION_DAYS: ${TRACE_RETENTION_DAYS:-7}
      TRACE_MAX_BYTES: ${TRACE_MAX_BYTES:-50000000}
      PHOENIX_UI_URL: ${PHOENIX_UI_URL:-http://localhost:6006}
      PROMETHEUS_URL: ${PROMETHEUS_URL:-http://localhost:9090}
      GRAFANA_URL: ${GRAFANA_URL:-http://localhost:3001}
      # Guardrail depth
      PREFILTER_BLOCK_THRESHOLD: ${PREFILTER_BLOCK_THRESHOLD:-0.80}
      PREFILTER_ALLOW_THRESHOLD: ${PREFILTER_ALLOW_THRESHOLD:-0.20}
      ADAPTIVE_ENABLED: ${ADAPTIVE_ENABLED:-true}
      # Evaluation budget (small default; hard ceiling caps all overrides)
      EVALUATION_DEFAULT_MAX_REQUESTS: ${EVALUATION_DEFAULT_MAX_REQUESTS:-60}
      EVALUATION_HARD_MAX_REQUESTS: ${EVALUATION_HARD_MAX_REQUESTS:-300}
      # Routing / circuit breaker
      OPENCODE_GO_FALLBACK_MODELS: ${OPENCODE_GO_FALLBACK_MODELS:-}
      CIRCUIT_FAILURE_THRESHOLD: ${CIRCUIT_FAILURE_THRESHOLD:-3}
      CIRCUIT_COOLDOWN_SECONDS: ${CIRCUIT_COOLDOWN_SECONDS:-60}
      # Hardening
      API_AUTH_TOKEN: ${API_AUTH_TOKEN:-}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-60}
      MAX_BODY_BYTES: ${MAX_BODY_BYTES:-1000000}
      LOG_PROMPTS: ${LOG_PROMPTS:-false}
      GENERATION_CONCURRENCY: ${GENERATION_CONCURRENCY:-2}
      TRUSTED_HOSTS: ${TRUSTED_HOSTS:-}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - hf_cache:/models/huggingface
      - evaluation_results:/app/results
      - trace_data:/app/traces
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 20s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      api:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: ["observability"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/alerts.yml:/etc/prometheus/alerts.yml:ro
      - ./observability/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    depends_on:
      api:
        condition: service_healthy

  grafana:
    image: grafana/grafana:12.1.0
    profiles: ["observability"]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-local-only-change-me}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

  # Optional trace plane. The app and its local JSONL trace buffer work without it.
  # UI and OTLP/HTTP collector share port 6006; traces POST to /v1/traces.
  phoenix:
    image: arizephoenix/phoenix:22.0.1@sha256:cc8c5e545389a6aae9523beaf92eb067fdaeae59d2166093d60856f89bf7ee34
    profiles: ["observability"]
    environment:
      PHOENIX_PORT: "6006"
      PHOENIX_WORKING_DIR: /phoenix-data
    ports:
      - "127.0.0.1:6006:6006"
    volumes:
      - phoenix_data:/phoenix-data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:6006/')"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s

  github-actions-exporter:
    image: idt-llm-cicd-api:latest
    profiles: ["observability"]
    command: ["uv", "run", "--no-sync", "python", "-m", "llm_app.github_actions_exporter"]
    environment:
      GITHUB_REPOSITORY: ${GITHUB_REPOSITORY:-sjreal/idt}
      GITHUB_ACTIONS_WORKFLOW_FILE: ${GITHUB_ACTIONS_WORKFLOW_FILE:-ci.yml}
      GITHUB_ACTIONS_BRANCH: ${GITHUB_ACTIONS_BRANCH:-main}
      GITHUB_ACTIONS_TOKEN: ${GITHUB_ACTIONS_TOKEN:-}
      GITHUB_ACTIONS_POLL_SECONDS: ${GITHUB_ACTIONS_POLL_SECONDS:-300}
      GITHUB_ACTIONS_METRICS_PORT: 9101
    ports:
      - "127.0.0.1:9101:9101"

  postgres:
    image: postgres:17-alpine
    profiles: ["data"]
    environment:
      POSTGRES_DB: idt
      POSTGRES_USER: idt
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-idt_local_only}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U idt -d idt"]
      interval: 10s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:0.6.8
    profiles: ["ollama"]
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

volumes:
  postgres_data:
  ollama_data:
  hf_cache:
  evaluation_results:
  prometheus_data:
  grafana_data:
  trace_data:
  phoenix_data:
