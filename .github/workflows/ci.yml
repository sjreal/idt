name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Python checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - run: uv sync --locked --all-groups
      - run: uv lock --project tools/garak --check --python 3.12
      - run: uv run ruff check .
      - name: Run Python tests
        run: uv run pytest -q --junitxml=pytest-report.xml
      - name: Summarize Python tests
        if: always()
        run: python scripts/summarize_junit.py pytest-report.xml
      - name: Upload Python test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-test-report
          path: pytest-report.xml
          if-no-files-found: warn
          retention-days: 14
      # LLM Guard 0.3.16 pins Transformers 4.51.3; these are allowlisted until
      # LLM Guard releases compatible dependency updates. NLTK has no fix version yet.
      - name: Audit Python dependencies
        run: |
          uv run pip-audit --local --skip-editable \
            --ignore-vuln PYSEC-2025-211 \
            --ignore-vuln PYSEC-2025-212 \
            --ignore-vuln PYSEC-2025-213 \
            --ignore-vuln PYSEC-2025-214 \
            --ignore-vuln PYSEC-2025-215 \
            --ignore-vuln PYSEC-2025-216 \
            --ignore-vuln PYSEC-2025-217 \
            --ignore-vuln PYSEC-2025-218 \
            --ignore-vuln PYSEC-2026-1977 \
            --ignore-vuln PYSEC-2026-1980 \
            --ignore-vuln PYSEC-2026-1981 \
            --ignore-vuln PYSEC-2026-1983 \
            --ignore-vuln PYSEC-2026-1986 \
            --ignore-vuln PYSEC-2026-1988 \
            --ignore-vuln PYSEC-2026-2288 \
            --ignore-vuln PYSEC-2026-2289 \
            --ignore-vuln PYSEC-2026-2290 \
            --ignore-vuln PYSEC-2026-3929 \
            --ignore-vuln PYSEC-2026-4174 \
            --ignore-vuln PYSEC-2026-3740

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm audit --audit-level=high

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  container-build-scan:
    name: Container build and vulnerability scan
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build --pull --file Dockerfile --tag idt-llm-cicd-api:ci .
      - name: Build frontend image
        run: docker build --pull --file frontend/Dockerfile --tag idt-llm-cicd-frontend:ci frontend
      - name: Scan API image
        uses: aquasecurity/trivy-action@v0.31.0
        with:
          version: v0.58.2
          scan-type: image
          image-ref: idt-llm-cicd-api:ci
          scanners: vuln
          vuln-type: os
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - name: Scan frontend image
        uses: aquasecurity/trivy-action@v0.31.0
        with:
          version: v0.58.2
          scan-type: image
          image-ref: idt-llm-cicd-frontend:ci
          scanners: vuln
          vuln-type: os
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
