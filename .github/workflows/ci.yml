name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Python checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - run: uv sync --locked --all-groups
      - run: uv lock --project tools/garak --check --python 3.12
      - run: uv run ruff check .
      - name: Run Python tests
        run: >-
          uv run pytest -q --junitxml=pytest-report.xml
          --cov=llm_app --cov=security_eval
          --cov-report=term-missing --cov-report=xml:coverage.xml
      - name: Summarize Python tests
        if: always()
        run: python scripts/summarize_junit.py pytest-report.xml coverage.xml
      - name: Upload Python test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-test-report
          path: |
            pytest-report.xml
            coverage.xml
          if-no-files-found: warn
          retention-days: 14
      # LLM Guard 0.3.16 pins Transformers 4.51.3; these are allowlisted until
      # LLM Guard releases compatible dependency updates. NLTK has no fix version yet.
      - name: Audit Python dependencies
        run: |
          uv run pip-audit --local --skip-editable \
            --ignore-vuln PYSEC-2025-211 \
            --ignore-vuln PYSEC-2025-212 \
            --ignore-vuln PYSEC-2025-213 \
            --ignore-vuln PYSEC-2025-214 \
            --ignore-vuln PYSEC-2025-215 \
            --ignore-vuln PYSEC-2025-216 \
            --ignore-vuln PYSEC-2025-217 \
            --ignore-vuln PYSEC-2025-218 \
            --ignore-vuln PYSEC-2026-1977 \
            --ignore-vuln PYSEC-2026-1980 \
            --ignore-vuln PYSEC-2026-1981 \
            --ignore-vuln PYSEC-2026-1983 \
            --ignore-vuln PYSEC-2026-1986 \
            --ignore-vuln PYSEC-2026-1988 \
            --ignore-vuln PYSEC-2026-2288 \
            --ignore-vuln PYSEC-2026-2289 \
            --ignore-vuln PYSEC-2026-2290 \
            --ignore-vuln PYSEC-2026-3929 \
            --ignore-vuln PYSEC-2026-4174 \
            --ignore-vuln PYSEC-2026-3740

  config-validation:
    name: Provider-free config validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: Check Prometheus rules with pinned promtool
        run: |
          docker run --rm \
            --entrypoint promtool \
            --volume "$PWD:/workspace:ro" \
            --workdir /workspace \
            prom/prometheus:v3.5.0 \
            check rules observability/alerts.yml observability/rules/slo.yml
      - name: Validate Docker Compose files (no containers started)
        run: |
          docker compose config --quiet
          docker compose -f docker-compose.yml -f docker-compose.observability.yml \
            --profile observability config --quiet
      - name: Validate pricing, evaluation data, and dashboard JSON (offline)
        env:
          PYTHONPATH: src
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          from llm_app.pricing import get_catalog

          root = Path(".")

          # The loader checks pricing JSON syntax, schema version, required
          # fields, and the committed integrity.sha256 checksum.
          catalog = get_catalog()
          assert catalog.schema_version == 1, catalog.schema_version
          assert catalog.models, "pricing catalog has no models"

          # Grafana dashboards must stay parseable; the live dashboard uid is pinned.
          dashboard_dir = root / "observability" / "grafana" / "dashboards"
          for path in sorted(dashboard_dir.glob("*.json")):
              dashboard = json.loads(path.read_text(encoding="utf-8"))
              assert isinstance(dashboard.get("uid"), str) and dashboard["uid"], path
              assert isinstance(dashboard.get("panels"), list), path
              if path.name == "llm-guardrail-lab.json":
                  assert dashboard["uid"] == "llm-guardrail-lab-live", path

          eval_dir = root / "data" / "evaluation"
          manifest_paths = sorted(eval_dir.glob("*.json"))
          assert manifest_paths, "no evaluation manifest JSON found"
          manifests = []
          for path in manifest_paths:
              payload = json.loads(path.read_text(encoding="utf-8"))
              assert isinstance(payload, dict), f"{path}: not a JSON object"
              for key in ("file", "sha256", "records"):
                  assert key in payload, f"{path}: missing {key}"
              assert isinstance(payload["file"], str) and payload["file"], path
              assert isinstance(payload["sha256"], str) and len(payload["sha256"]) == 64, path
              assert isinstance(payload["records"], int) and payload["records"] >= 0, path
              manifests.append(payload)

          jsonl_paths = sorted(eval_dir.glob("*.jsonl"))
          for path in jsonl_paths:
              lines = [line for line in path.read_text(encoding="utf-8").splitlines() if line.strip()]
              for number, line in enumerate(lines, 1):
                  assert isinstance(json.loads(line), dict), f"{path}:{number}: not an object"
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              matching = [manifest for manifest in manifests if manifest["file"] == path.name]
              assert matching, f"{path}: no manifest declares this dataset"
              for manifest in matching:
                  assert manifest["sha256"] == digest, f"{path}: sha256 mismatch"
                  assert manifest["records"] == len(lines), f"{path}: record count mismatch"

          print(
              f"Validated {len(manifest_paths)} JSON file(s), {len(jsonl_paths)} JSONL file(s), "
              f"and pricing catalog sha256 {catalog.sha256}."
          )
          PY

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm audit --audit-level=high

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  container-build-scan:
    name: Container build and vulnerability scan
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build --pull --file Dockerfile --tag idt-llm-cicd-api:ci .
      - name: Build frontend image
        run: docker build --pull --file frontend/Dockerfile --tag idt-llm-cicd-frontend:ci frontend
      - name: Provider-free container smoke test
        run: bash scripts/container_smoke_test.sh
      - name: Generate CycloneDX SBOMs
        run: |
          mkdir -p "$RUNNER_TEMP/sbom"
          docker save idt-llm-cicd-api:ci --output "$RUNNER_TEMP/sbom/api-image.tar"
          docker run --rm \
            --volume "$RUNNER_TEMP/sbom:/reports" \
            aquasec/trivy:0.58.2 \
            image --input /reports/api-image.tar --format cyclonedx \
            --output /reports/api-image.cdx.json
          rm "$RUNNER_TEMP/sbom/api-image.tar"
          docker save idt-llm-cicd-frontend:ci --output "$RUNNER_TEMP/sbom/frontend-image.tar"
          docker run --rm \
            --volume "$RUNNER_TEMP/sbom:/reports" \
            aquasec/trivy:0.58.2 \
            image --input /reports/frontend-image.tar --format cyclonedx \
            --output /reports/frontend-image.cdx.json
          rm "$RUNNER_TEMP/sbom/frontend-image.tar"
      - name: Upload container SBOMs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: container-sboms
          path: ${{ runner.temp }}/sbom/*.cdx.json
          if-no-files-found: warn
          retention-days: 90
      - name: Scan API image
        run: |
          mkdir -p "$RUNNER_TEMP/trivy-cache"
          docker run --rm \
            --volume /var/run/docker.sock:/var/run/docker.sock \
            --volume "$RUNNER_TEMP/trivy-cache:/root/.cache" \
            aquasec/trivy:0.58.2 \
            image --scanners vuln --pkg-types os --severity CRITICAL,HIGH \
            --ignore-unfixed --exit-code 1 idt-llm-cicd-api:ci
      - name: Scan frontend image
        run: |
          docker run --rm \
            --volume /var/run/docker.sock:/var/run/docker.sock \
            --volume "$RUNNER_TEMP/trivy-cache:/root/.cache" \
            aquasec/trivy:0.58.2 \
            image --scanners vuln --pkg-types os --severity CRITICAL,HIGH \
            --ignore-unfixed --exit-code 1 idt-llm-cicd-frontend:ci
